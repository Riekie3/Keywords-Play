<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keyword Cloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ece6e1; --panel:#ffffff; --text:#2b1512; --muted:#7b6863; --line:#dcd1ca; --accent:#8e1426; --accent-text:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1312; --panel:#261c1a; --text:#f2e8e3; --muted:#a8958f; --line:#3d2f2c; --accent:#c42a40; --accent-text:#ffffff;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1312; --panel:#261c1a; --text:#f2e8e3; --muted:#a8958f; --line:#3d2f2c; --accent:#c42a40; --accent-text:#ffffff;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Oswald','Arial Narrow',Impact,sans-serif;}
.wrap{max-width:900px;height:100%;margin:0 auto;padding:8px;display:flex;flex-direction:column;gap:8px}
#area{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.panel{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
.row{display:flex;gap:6px;align-items:center}
label{font-size:13px;color:var(--muted);width:74px;flex:none;line-height:1.1}
input[type=text]{flex:1;min-width:0;font:500 18px 'Oswald','Arial Narrow',sans-serif;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:500 16px 'Oswald','Arial Narrow',sans-serif;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);padding:6px 12px;cursor:pointer;flex:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.tools{margin-top:6px}
.tools button{flex:1;padding:5px 4px;font-size:14px}
#frame{position:relative;flex:none;background:#ffffff;border-radius:6px;overflow:hidden;box-shadow:0 2px 14px rgba(40,10,10,.12)}
#stage{position:absolute;left:0;top:0;width:900px;height:1100px;transform-origin:0 0}
.w{position:absolute;white-space:nowrap;line-height:.86;font-weight:600;letter-spacing:-.01em;cursor:pointer;user-select:none}
.w .in{display:block}
.w.new .in{animation:pop .55s cubic-bezier(.2,1.5,.45,1) both}
.w.center{cursor:default}
#meas{visibility:hidden;position:absolute;left:0;top:0}
@keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.w.new .in{animation:none}}
#pngModal{position:fixed;inset:0;background:rgba(20,8,6,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
#pngModal[hidden]{display:none}
#pngImg{display:block;width:auto;max-width:100%;max-height:52vh;margin:0 auto;border-radius:6px;border:1px solid var(--line);background:#fff}
.sheet{background:var(--panel);color:var(--text);border-radius:12px;width:100%;max-width:440px;max-height:80vh;display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line)}
.sheet h2{margin:0;font-size:20px;font-weight:600}
.msg{font:13px system-ui,sans-serif;color:var(--muted);margin:0}
#status{margin-top:6px}
#status:empty{display:none}
body.clean .ctrl{display:none}
#showCtrl{display:none;position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel);opacity:.85}
body.clean #showCtrl{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel ctrl">
    <div class="row">
      <label for="center">Center word</label>
      <input type="text" id="center" value="Key Points" autocomplete="off">
    </div>
    <div class="row" style="margin-top:6px">
      <label for="kw">Add keyword</label>
      <input type="text" id="kw" placeholder="Word, or several with commas" autocomplete="off" enterkeyhint="done">
      <button class="primary" id="add">Add</button>
    </div>
    <div class="row tools">
      <button id="undo">Undo</button>
      <button id="shuffle">Shuffle</button>
      <button id="clear">Clear</button>
      <button id="save" title="Save the keywords as a CSV file (opens in Excel or Notepad)">Save</button>
      <button id="open" title="Open a saved .csv or .txt file">Open</button>
      <button id="png">PNG</button>
      <button id="clean">Hide</button>
    </div>
    <p class="msg" id="status" role="status"></p>
    <input type="file" id="file" accept=".csv,.txt,text/csv,text/plain" hidden>
  </div>
  <div id="area"><div id="frame"><div id="stage"><span id="meas" class="w"></span></div></div></div>
</div>
<button id="showCtrl">Show controls</button>
<div id="pngModal" hidden>
  <div class="sheet" role="dialog" aria-label="Export PNG">
    <h2>Export PNG</h2>
    <img id="pngImg" alt="Keyword cloud image">
    <p class="msg">Tap Download, or right-click / long-press the image to save it.</p>
    <div class="row">
      <button class="primary" id="pngDl" style="flex:1">Download PNG</button>
      <button id="pngClose" style="flex:1">Close</button>
    </div>
  </div>
</div>


<script>
const W=900,H=1100,CX=W/2,CY=H/2,PAD=4,MARGIN=14;
const PALETTE=['#5c0612','#7a0e1c','#9c1a2e','#b0243a','#b4461c','#c0621a','#c8900a','#2b1512','#3e1d16'];
const $=id=>document.getElementById(id);
const stage=$('stage'),frame=$('frame'),meas=$('meas'),area=$('area');
const centerIn=$('center'),kwIn=$('kw');
let state={center:'Key Points',words:[]};
let boxes=[];
let history=[],pendingCenter=null;
const statusEl=$('status');

function save(){try{localStorage.setItem('kwcloud',JSON.stringify(state))}catch(e){}}
// first-time visitors see an example cloud; Clear removes it
const EXAMPLE=['Strategy','Growth','Teamwork','Customers','Innovation','Quality','Vision','Results','Trust','Focus','Planning','Goals','Data','Speed'];
function loadLocal(){
  let s=null;try{s=JSON.parse(localStorage.getItem('kwcloud')||'null')}catch(e){}
  if(s&&s.words)state=s;else state={center:'Key Points',words:EXAMPLE.map(makeWord)};
}
// call before any change so Undo can step back to it
function snapshot(){history.push(JSON.stringify(state));if(history.length>50)history.shift()}
// shows msg, or else lists keywords that currently have no room in the cloud
function setStatus(msg){
  const hidden=state.words.filter(w=>!w.p).map(w=>w.text);
  statusEl.textContent=msg||(hidden.length?`No room for: ${hidden.join(', ')}. Shuffle, or tap a word to remove it.`:'');
}

function fit(){const s=Math.min(area.clientWidth/W,area.clientHeight/H);stage.style.transform=`scale(${s})`;frame.style.width=(W*s)+'px';frame.style.height=(H*s)+'px'}

function measure(text,size,weight){
  meas.style.fontSize=size+'px';meas.style.fontWeight=weight;meas.textContent=text;
  return {w:meas.offsetWidth,h:meas.offsetHeight};
}
function hit(a){
  if(a.x<MARGIN||a.y<MARGIN||a.x+a.w>W-MARGIN||a.y+a.h>H-MARGIN)return true;
  for(const b of boxes){
    if(a.x<b.x+b.w+PAD&&a.x+a.w+PAD>b.x&&a.y<b.y+b.h+PAD&&a.y+a.h+PAD>b.y)return true;
  }
  return false;
}
function spiral(w,h){
  const start=Math.random()*Math.PI*2,dir=Math.random()<.5?1:-1;
  let t=0;
  while(t<400){
    const r=4*t,ang=start+dir*t;
    const x=CX+r*Math.cos(ang)*0.95,y=CY+r*Math.sin(ang)*1.15;
    const a={x:x-w/2,y:y-h/2,w,h};
    if(!hit(a))return a;
    t+=Math.min(0.25,5/Math.max(r,1));
    if(r>900)break;
  }
  return null;
}
function randSize(){
  const p=Math.random();
  if(p<.1)return 96+Math.random()*30;
  if(p<.35)return 62+Math.random()*26;
  return 34+Math.random()*24;
}
function makeWord(text){
  return {text,size:Math.round(randSize()),rot:Math.random()<.28,
    color:PALETTE[Math.floor(Math.random()*PALETTE.length)],
    weight:Math.random()<.5?600:500,id:Date.now()+'-'+Math.floor(Math.random()*1e6)};
}
function placeWord(wd){
  let size=wd.size;
  for(let k=0;k<9;k++){
    const m=measure(wd.text,size,wd.weight);
    const w=wd.rot?m.h:m.w,h=wd.rot?m.w:m.h;
    const box=spiral(w,h);
    if(box){boxes.push(box);return {size,box,m}}
    size*=0.82;if(size<14)break;
  }
  return null;
}
function drawWord(wd,p,isNew,isCenter){
  const el=document.createElement('span');
  el.className='w'+(isNew?' new':'')+(isCenter?' center':'');
  el.style.fontSize=p.size+'px';el.style.fontWeight=wd.weight;el.style.color=wd.color;
  const cx=p.box.x+p.box.w/2,cy=p.box.y+p.box.h/2;
  el.style.left=(cx-p.m.w/2)+'px';el.style.top=(cy-p.m.h/2)+'px';
  if(wd.rot)el.style.transform='rotate(90deg)';
  const inner=document.createElement('span');inner.className='in';inner.textContent=wd.text;
  el.appendChild(inner);
  if(!isCenter){el.title='Tap to remove';el.addEventListener('click',()=>{snapshot();state.words=state.words.filter(x=>x.id!==wd.id);save();layout(false,true);setStatus()})}
  stage.appendChild(el);
}
// reuse=true keeps each word where it was placed before
function layout(animateAll,reuse){
  [...stage.querySelectorAll('.w:not(#meas)')].forEach(e=>e.remove());
  boxes=[];
  const c=state.center.trim()||' ';
  const t=measure(c,200,700);
  const size=Math.min(300,200*(W*0.86)/Math.max(t.w,1));
  const m=measure(c,size,700);
  const box={x:CX-m.w/2,y:CY-m.h/2,w:m.w,h:m.h};
  boxes.push(box);
  drawWord({text:c,weight:700,color:'#5c0612',rot:false},{size,box,m},false,true);
  if(reuse){state.words.forEach(wd=>{if(wd.p)boxes.push(wd.p.box)})}
  const order=[...state.words].sort((a,b)=>b.size-a.size);
  for(const wd of order){
    if(reuse&&wd.p){drawWord(wd,wd.p,animateAll,false);continue}
    const p=placeWord(wd);
    if(p){wd.p=p;drawWord(wd,p,animateAll,false)}else{wd.p=null}
  }
}
function addWords(){
  const parts=kwIn.value.split(',').map(s=>s.trim()).filter(Boolean);
  if(!parts.length)return;
  snapshot();
  parts.forEach((txt,i)=>{
    const wd=makeWord(txt);
    // words with no room are kept (p=null), listed in the status line and retried on every layout
    wd.p=placeWord(wd);state.words.push(wd);
    if(wd.p)setTimeout(()=>drawWord(wd,wd.p,true,false),i*120);
  });
  save();setStatus();kwIn.value='';kwIn.focus();
}
$('add').onclick=addWords;
kwIn.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addWords()}});
centerIn.addEventListener('focus',()=>{pendingCenter=JSON.stringify(state)});
centerIn.addEventListener('input',()=>{
  if(pendingCenter){history.push(pendingCenter);pendingCenter=null}
  state.center=centerIn.value;save();layout(false,false);setStatus();
});
$('undo').onclick=()=>{
  if(!history.length){setStatus('Nothing to undo.');return}
  state=JSON.parse(history.pop());centerIn.value=state.center;pendingCenter=null;
  save();layout(false,true);setStatus();
};
$('shuffle').onclick=()=>{snapshot();state.words.forEach(w=>{w.rot=Math.random()<.28;w.color=PALETTE[Math.floor(Math.random()*PALETTE.length)]});layout(true,false);save();setStatus()};
$('clear').onclick=()=>{
  if(!state.words.length)return;
  snapshot();state.words=[];save();layout(false,true);
  setStatus('Cleared. Press Undo to bring the keywords back.');
};
$('clean').onclick=()=>{document.body.classList.add('clean');fit()};
$('showCtrl').onclick=()=>{document.body.classList.remove('clean');fit()};
window.addEventListener('resize',fit);

function fileBase(){return (state.center.trim()||'keyword-cloud').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')||'keyword-cloud'}

// ---------- PNG export ----------
const EXPORT_SCALE=2;
let pngUrl=null,pngName='keyword-cloud.png';
function drawText(ctx,text,size,weight,color,cx,cy,rot){
  ctx.font=`${weight} ${size}px Oswald, 'Arial Narrow', sans-serif`;
  ctx.fillStyle=color;ctx.textAlign='center';
  if('letterSpacing' in ctx)ctx.letterSpacing=(-0.01*size)+'px';
  ctx.save();ctx.translate(cx,cy);if(rot)ctx.rotate(Math.PI/2);
  // match CSS, where the font's ascent+descent is centred in the line box
  const fm=ctx.measureText(text);
  if(fm.fontBoundingBoxAscent!=null){ctx.textBaseline='alphabetic';ctx.fillText(text,0,(fm.fontBoundingBoxAscent-fm.fontBoundingBoxDescent)/2)}
  else{ctx.textBaseline='middle';ctx.fillText(text,0,0)}
  ctx.restore();
}
function renderPng(){
  const cv=document.createElement('canvas');cv.width=W*EXPORT_SCALE;cv.height=H*EXPORT_SCALE;
  const ctx=cv.getContext('2d');ctx.scale(EXPORT_SCALE,EXPORT_SCALE);
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
  const c=state.center.trim();
  if(c){
    const t=measure(c,200,700);
    const size=Math.min(300,200*(W*0.86)/Math.max(t.w,1));
    drawText(ctx,c,size,700,'#5c0612',CX,CY,false);
  }
  state.words.forEach(wd=>{if(!wd.p)return;const b=wd.p.box;drawText(ctx,wd.text,wd.p.size,wd.weight,wd.color,b.x+b.w/2,b.y+b.h/2,wd.rot)});
  return cv;
}
$('png').onclick=()=>{
  const cv=renderPng();
  pngName=fileBase()+'.png';
  cv.toBlob(b=>{
    if(!b)return;
    if(pngUrl)URL.revokeObjectURL(pngUrl);
    pngUrl=URL.createObjectURL(b);
    $('pngImg').src=pngUrl;$('pngModal').hidden=false;
  },'image/png');
};
$('pngDl').onclick=()=>{if(pngUrl)download(pngUrl,pngName)};
$('pngClose').onclick=()=>{$('pngModal').hidden=true};
$('pngModal').addEventListener('click',e=>{if(e.target===$('pngModal'))$('pngModal').hidden=true});

// ---------- Save / Open as a CSV file (Excel or Notepad) ----------
// Format: a header row, one "Center" row, then one "Keyword" row per word.
// Size/Color/Rotated are optional; a plain .txt list (one word per line) also opens.
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}
function csvCell(v){v=String(v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function parseCsvLine(line){
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===','||ch===';'||ch==='\t'){out.push(cur);cur=''}
    else cur+=ch;
  }
  out.push(cur);return out.map(s=>s.trim());
}
$('save').onclick=()=>{
  const rows=[['Type','Word','Size','Color','Rotated'],['Center',state.center,'','','']];
  state.words.forEach(w=>rows.push(['Keyword',w.text,w.size,w.color,w.rot?'yes':'no']));
  const text='﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')+'\r\n';
  const url=URL.createObjectURL(new Blob([text],{type:'text/csv'}));
  download(url,fileBase()+'.csv');setTimeout(()=>URL.revokeObjectURL(url),5000);
  setStatus(`Downloaded ${fileBase()}.csv. Open it later with the Open button, or edit it in Excel or Notepad.`);
};
$('open').onclick=()=>$('file').click();
$('file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f)return;
  let text;try{text=await f.text()}catch(err){setStatus('Could not read that file.');return}
  let center=null;const words=[];
  text.replace(/^﻿/,'').split(/\r?\n/).forEach(line=>{
    if(!line.trim())return;
    const c=parseCsvLine(line);
    const type=c.length>1?c[0].toLowerCase():'keyword';
    const word=c.length>1?c[1]:c[0];
    if(type==='type'||!word)return;
    if(type==='center'){center=word;return}
    const wd=makeWord(word);
    const size=parseFloat(c[2]);if(size>=10&&size<=200)wd.size=Math.round(size);
    if(/^#[0-9a-f]{6}$/i.test(c[3]||''))wd.color=c[3];
    if(/^(yes|no)$/i.test(c[4]||''))wd.rot=/^yes$/i.test(c[4]);
    words.push(wd);
  });
  if(center===null&&!words.length){setStatus('No keywords found in that file.');return}
  snapshot();
  state={center:center===null?state.center:center,words};
  centerIn.value=state.center;save();layout(true,false);
  const hidden=state.words.filter(w=>!w.p).length;
  setStatus(`Opened ${f.name} (${words.length} keywords${hidden?`, ${hidden} with no room`:''}). Press Undo to go back.`);
};

(async()=>{
  loadLocal();centerIn.value=state.center;
  fit();
  try{await Promise.all([document.fonts.load('700 60px Oswald'),document.fonts.load('600 60px Oswald'),document.fonts.load('500 60px Oswald')]);}catch(e){}
  layout(true,true);save();setStatus();
})();
</script>
</body>
</html>
